<div class="app-layout">

  <!-- =====================
       SIDEBAR GAUCHE
  ====================== -->
 <aside class="sidebar">
  <div class="photo-list">
  <app-photo-card 
    *ngFor="let photo of photos" 
    [photomodel]="photo" 
    (photoClicked)="onPhotoCardClick($event)">
  </app-photo-card>
  </div>
</aside>

  <!-- =====================
       MAP CENTRALE
  ====================== -->
  <main class="map-container">
   <app-map 
  [photomodels]="photos"
  #mapComponent
  (photoSelected)="selectedPhoto = $event">
</app-map>
  </main>

<!-- =====================
     PANEL DETAIL DROIT
====================== -->
<aside class="detail-panel" *ngIf="selectedPhoto">
  <h3 class="detail-title">{{ selectedPhoto.title }}</h3>

  <div class="detail-photo-wrapper">
    <img [src]="selectedPhoto.image_location" alt="Photo sélectionnée" class="detail-photo" (click)="onPhotoCardClick(selectedPhoto)" style="cursor: pointer;"/>
  </div>

  <div class="detail-info">
    <h2>{{ selectedPhoto.description || 'Pas de description' }}</h2>
    <p>📅 {{ selectedPhoto.date }}</p>
    <p>📍 {{ selectedPhoto.location }}</p>
  </div>

  <!-- Menu actions en bas à droite du panneau détail -->
  <div class="detail-actions" *ngIf="selectedPhoto">
    <div class="pie-and-legend">
      <app-pie-chart [items]="colorDistribution"></app-pie-chart>
      <div class="color-legend">
        <ng-container *ngIf="colorDistributionWithPercent && colorDistributionWithPercent.length; else noLegend">
          <div class="color-legend-item" *ngFor="let it of colorDistributionWithPercent">
            <span class="swatch" [style.background]="it.color"></span>
            <span class="label">{{ it.value }} — {{ it.percent }}%</span>
          </div>
        </ng-container>
        <ng-template #noLegend>
          <div class="color-legend-item no-data">Aucune couleur</div>
        </ng-template>
      </div>
    </div>

    <div class="actions-row">
      <button class="action-btn" (click)="download(selectedPhoto)" aria-label="Télécharger">⬇️</button>
      <button class="action-btn" (click)="share(selectedPhoto)" aria-label="Partager">🔗</button>
      <button class="action-btn" (click)="toggleFavorite(selectedPhoto)" [class.favorited]="selectedPhoto.favorite" aria-label="Favoris">⭐</button>
    </div>
  </div>
</aside>

</div>
