<div class="photo-card">
  <!-- IMAGE -->
  <div class="photo-image-wrapper">
    <img src="{{ photomodel.image_location }}" alt="Photo" class="photo-image" />
  </div>

  <!-- INFOS -->
  <div class="photo-info">
    <h2 class="photo-description">{{ photomodel.description }}</h2>
    <div class="photo-meta">
      <span class="photo-date">📅 {{ photomodel.date }}</span>
      <span class="photo-location">📍 {{ photomodel.location }}</span>
    </div>
  </div>

  <!-- Bande couleur droite -->
  <div class="photo-card-color" [style.background-color]="photomodel.color"></div>
</div>
